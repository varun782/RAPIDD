<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Employee Working Hours</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
            background-color: #f4f6f9;
        }

        h1 {
            text-align: center;
            color: #26364a;
        }

        table {
            width: 80%;
            margin: auto;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 14px;
            border: 1px solid #ddd;
            text-align: center;
        }

        th {
            background-color: #26364a;
            color: white;
        }

        tr.low-hours {
            background-color: #f70808;
            color: white;
        }

        tr:nth-child(even):not(.low-hours) {
            background-color: #edf1f5;
        }
    </style>
</head>

<body>

</html>
